<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FLUX TAG</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b0f1a'/><path d='M8 22 16 6l8 16-8-4z' fill='%23ff7a2f'/></svg>">
<style>
  html,body{margin:0;height:100%;background:#05070d;overflow:hidden;font-family:system-ui,sans-serif;user-select:none}
  #app{position:fixed;inset:0}
  #app canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;inset:0;pointer-events:none}
  #ui > *{pointer-events:auto}
  #ui:empty::before{content:'FLUX TAG';position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(90% 80% at 50% 45%,#0c1626,#04060b 70%);color:#e9eef7;font:italic 800 clamp(36px,7vw,96px)/1 'Barlow Condensed','Arial Narrow',system-ui,sans-serif;letter-spacing:.12em}
  #ui:empty::after{content:'';position:fixed;left:50%;bottom:9vh;width:min(34rem,60vw);height:4px;translate:-50% 0;background:linear-gradient(90deg,#ff7a2f,#2fd0ff);animation:fxpre 1.2s ease-in-out infinite alternate}
  @keyframes fxpre{from{clip-path:inset(0 85% 0 0)}to{clip-path:inset(0 0 0 85%)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ui"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
