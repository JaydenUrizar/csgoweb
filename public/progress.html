<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLUX TAG — Live Progress</title>
<style>
:root{--bg:#070a12;--panel:#0f1524;--line:#1c2540;--tx:#e8eefc;--dim:#8a97b8;--em:#ff7a2f;--ti:#2fd0ff;--ok:#5dff9a;--warn:#ffd35a;--bad:#ff5a6e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{padding:22px 24px 10px;display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(255,122,47,.12),transparent 40%,rgba(47,208,255,.12))}
h1{margin:0;font-size:26px;letter-spacing:.14em}h1 b{color:var(--em)}h1 i{color:var(--ti);font-style:normal}
.meta{color:var(--dim);font-size:12px;text-align:right}.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:#18213a;margin-left:6px;color:var(--tx)}
main{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:18px;padding:18px 24px}
@media(max-width:980px){main{grid-template-columns:1fr}}
h2{font-size:12px;letter-spacing:.16em;color:var(--dim);margin:0 0 10px;text-transform:uppercase}
.overall{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bar{height:10px;border-radius:9px;background:#141c33;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--em),var(--ti));transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden}
.card.building{border-color:#3b5bb0}.card.judging{border-color:#a07af0}.card.passed{border-color:#2f8f5a}
.card h3{margin:0 0 4px;font-size:14px}.st{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.building .st{color:#7aa2ff}.judging .st{color:#c3a3ff}.passed .st{color:var(--ok)}
.score{font-size:22px;font-weight:700}.gap{color:var(--dim);font-size:12px;margin-top:6px;min-height:34px}
.spark{display:flex;gap:2px;align-items:flex-end;height:22px;margin-top:6px}.spark i{display:block;width:6px;background:var(--ti);opacity:.8;border-radius:1px}.spark i.ours{background:var(--ok)}.spark i.ref{background:var(--bad)}
.pulse{position:absolute;right:12px;top:12px;width:8px;height:8px;border-radius:50%;background:#7aa2ff;animation:p 1.2s infinite}.judging .pulse{background:#c3a3ff}.passed .pulse,.queued .pulse{display:none}
@keyframes p{50%{opacity:.2;transform:scale(1.6)}}
.log{max-height:360px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:16px}
.log div{padding:5px 0;border-bottom:1px solid #141c33;font-size:12.5px}.log time{color:var(--dim);margin-right:8px;font-size:11px}
.k-wave{color:var(--warn);font-weight:600}.k-critic{color:#c3a3ff}.k-integrate{color:var(--ok)}
.snaps{display:grid;grid-template-columns:1fr 1fr;gap:8px}.snaps figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.snaps img{width:100%;display:block;cursor:zoom-in}.snaps figcaption{padding:5px 8px;font-size:11px;color:var(--dim)}
#big{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9}#big img{max-width:96vw;max-height:96vh}
</style></head><body>
<header><div><h1>FLUX<b> </b><i>TAG</i> <span style="font-size:12px;color:var(--dim);letter-spacing:.2em">LIVE BUILD</span></h1><div id="phase" style="color:var(--dim);margin-top:4px"></div></div><div class="meta" id="meta"></div></header>
<main><section><div class="overall"><h2>Overall quality vs. Counter-Strike 2</h2><div class="bar"><div id="ob" style="width:0"></div></div><div id="ot" style="margin-top:6px;color:var(--dim);font-size:12px"></div></div>
<h2>Pieces</h2><div class="grid" id="grid"></div></section>
<aside><h2>Activity</h2><div class="log" id="log"></div><h2>Latest frames</h2><div class="snaps" id="snaps"></div></aside></main>
<div id="big" onclick="this.style.display='none'"><img></div>
<script>
const $=id=>document.getElementById(id);const ago=t=>{const s=(Date.now()-new Date(t))/1000;return s<90?Math.round(s)+'s':s<5400?Math.round(s/60)+'m':Math.round(s/3600)+'h'};
async function tick(){try{const p=await (await fetch('progress.json?'+Date.now())).json();
$('phase').textContent=`Wave ${p.wave} · ${p.phase||''}`;$('meta').innerHTML=`updated ${ago(p.updated)} ago<span class="pill">${p.pieces.filter(x=>x.status==='passed').length}/${p.pieces.length} passed</span>`;
const avg=p.pieces.length?p.pieces.reduce((a,x)=>a+(x.score||0),0)/p.pieces.length:0;$('ob').style.width=avg*10+'%';$('ot').textContent=`Average blind-critic score ${avg.toFixed(1)}/10 — 10 = critic can't tell it from CS2 / prefers ours`;
$('grid').innerHTML=p.pieces.map(x=>`<div class="card ${x.status}"><span class="pulse"></span><div class="st">${x.status} · round ${x.round||0} · ${x.group}</div><h3>${x.name}</h3><div class="score">${(x.score||0).toFixed(1)}<span style="font-size:12px;color:var(--dim)"> /10</span></div><div class="spark">${(x.history||[]).slice(-16).map(h=>`<i class="${h.winner}" style="height:${Math.max(2,(h.score||0)*2.2)}px" title="r${h.round}: ${h.winner||''} ${h.score}"></i>`).join('')}</div><div class="gap">${x.gap?'Biggest gap: '+x.gap:(x.note||'')}</div></div>`).join('');
$('log').innerHTML=p.log.slice(0,60).map(l=>`<div class="k-${l.kind}"><time>${ago(l.t)}</time>${l.text.replace(/</g,'&lt;')}</div>`).join('');
$('snaps').innerHTML=p.snaps.slice(0,12).map(s=>`<figure><img src="${s.src}" loading="lazy" onclick="big.style.display='grid';big.firstChild.src=this.src"><figcaption>${s.caption.replace(/</g,'&lt;')} · ${ago(s.t)}</figcaption></figure>`).join('');
}catch(e){}}
const big=$('big');tick();setInterval(tick,4000);
</script></body></html>
